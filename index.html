<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <!-- Título que aparece na aba -->
    <title>Meus sites favoritos</title>

    <!-- Estilo da página -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #154360;
        }

        .site {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 12px;
            max-width: 350px;
        }

        img {
            width: 120px;
            height: 120px;
        }

        a {
            color: #21618c;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Título principal da página -->
    <h2>Meus sites favoritos: Matheus Rodrigues Felix</h2>

    <!-- Primeiro site: YouTube -->
    <div class="site">
        <h1>YouTube</h1>
        <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="YouTube">
        <p>
            <a href="https://www.youtube.com" target="_blank">
                Acessar YouTube
            </a>
        </p>
    </div>

    <!-- Segundo site: Google -->
    <div class="site">
        <h1>Google</h1>
        <img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="Google">
        <p>
            <a href="https://www.google.com" target="_blank">
                Acessar Google
            </a>
        </p>
    </div>

    <!-- Terceiro site: Canva -->
    <div class="site">
        <h1>Canva</h1>
        <img src="https://www.google.com/s2/favicons?domain=canva.com&sz=128" alt="Canva">
        <p>
            <a href="https://www.canva.com" target="_blank">
                Acessar Canva
            </a>
        </p>
    </div>

    <!-- Quarto site: GitHub -->
    <div class="site">
        <h1>GitHub</h1>
        <img src="https://www.google.com/s2/favicons?domain=github.com&sz=128" alt="GitHub">
        <p>
            <a href="https://github.com" target="_blank">
                Acessar GitHub
            </a>
        </p>
    </div>

    <!-- Quinto site: Wikipedia -->
    <div class="site">
        <h1>Wikipedia</h1>
        <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=128" alt="Wikipedia">
        <p>
            <a href="https://www.wikipedia.org" target="_blank">
                Acessar Wikipedia
            </a>
        </p>
    </div>

</body>
</html>
